name: gestimou_mobile
description: Gérance Immo Service - Application mobile pour résidents et gestionnaires.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.1.0
  shared_preferences: ^2.2.0
  provider: ^6.0.0
  intl: ^0.20.3
  file_picker: ^8.0.0
  http_parser: ^4.1.0
  cupertino_icons: ^1.0.2
  flutter_local_notifications: ^19.0.0
  flutter_svg: ^2.0.10+1
  # Ouverture des documents telecharges (mobile uniquement : sur le web le
  # navigateur telecharge directement, voir file_opener_web.dart).
  path_provider: ^2.1.6
  open_filex: ^4.7.0
  web: ^1.1.1
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/
    - assets/icones/
    - assets/residences/
    - assets/figma/
    - assets/figma/icons/
    - assets/brand/
    - assets/figma/onboarding/
    - assets/figma/empty/

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
          weight: 400
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon_monogram.png"
  adaptive_icon_foreground: "assets/app_icon_monogram.png"
  adaptive_icon_background: "#FDF4E2"
  adaptive_icon_foreground_inset: 16
  remove_alpha_ios: true
